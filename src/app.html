		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo-square.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="google-adsense-account" content="ca-pub-2219281381026289" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Matches --canvas in each mode, so browser chrome meets the page ground. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<script>
			// Stamp the theme before first paint so the page never flashes the wrong mode.
			(() => {
				try {
					const saved = localStorage.getItem("nx-theme");
					const dark = saved
						? saved === "dark"
						: window.matchMedia("(prefers-color-scheme: dark)").matches;
					document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
				} catch {
					document.documentElement.setAttribute("data-theme", "light");
				}
			})();
		</script>
		<style>
			/* Boot splash. Literal values, because this paints before app.css and
			   the fonts load. It fades in after 150ms, so a fast load shows nothing. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				background: #f5f5f5;
				opacity: 0;
				animation: boot-in 200ms ease 150ms forwards;
			}
			[data-theme="dark"] #boot {
				background: #0a0a0a;
			}
			#boot svg {
				width: 44px;
				height: 44px;
				fill: #0a0a0a;
			}
			[data-theme="dark"] #boot svg {
				fill: #fafafa;
			}
			#boot-track {
				position: relative;
				width: 96px;
				height: 2px;
				overflow: hidden;
				background: #e5e5e5;
			}
			[data-theme="dark"] #boot-track {
				background: #303030;
			}
			#boot-track span {
				position: absolute;
				inset: 0 auto 0 0;
				width: 32px;
				background: #9000fb;
				animation: boot-slide 1.1s cubic-bezier(0.32, 0.72, 0, 1) infinite;
			}
			[data-theme="dark"] #boot-track span {
				background: #b896f3;
			}
			html[data-done] #boot {
				opacity: 0;
				pointer-events: none;
				transition: opacity 200ms ease;
			}
			@keyframes boot-in {
				to {
					opacity: 1;
				}
			}
			@keyframes boot-slide {
				0% {
					transform: translateX(-100%);
				}
				100% {
					transform: translateX(300%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot {
					animation: none;
					opacity: 1;
				}
				#boot-track span {
					animation: none;
					width: 100%;
				}
			}
		</style>
		%sveltekit.head%
	</head>

		<div id="boot" aria-hidden="true">

			</svg>
			<div id="boot-track"><span></span></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
